<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1b">
<meta name="description" content="NOVA Command Center mobile launcher">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="nova-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="nova-icon-180.png">
<title>NOVA Command Center</title>
<style>
:root{color-scheme:dark;--bg:#060b17;--panel:#0b1426;--cyan:#50d9ff;--blue:#4389ff;--text:#e8f2ff;--muted:#8195b2;--line:rgba(77,167,255,.22)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 20% 0%,rgba(23,66,111,.34),transparent 48%),radial-gradient(ellipse at 95% 90%,rgba(33,48,108,.2),transparent 42%),var(--bg)}
main{width:min(100%,440px);padding:30px 24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(15,31,54,.98),rgba(6,13,27,.99));box-shadow:0 18px 60px #0006;text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.logo{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 20px;border:1px solid var(--cyan);border-radius:22px;color:var(--cyan);font-size:24px;font-weight:950;letter-spacing:1px;box-shadow:0 0 30px #50d9ff22}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--cyan)}h1{font-size:27px;letter-spacing:-.8px;margin:12px 0}p{font-size:13px;line-height:1.75;color:var(--muted);margin:0 0 22px}
button{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:14px 16px;border:0;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer}
.primary{background:linear-gradient(100deg,var(--cyan),#8db6ff);color:#06111d}.secondary{margin-top:10px;color:#c5d5e9;background:#101d32;border:1px solid var(--line)}.status{margin-top:16px;min-height:20px;font-size:11px;color:var(--muted)}.foot{margin-top:22px;font-size:9px;letter-spacing:1.5px;color:#506681}
</style>
</head>
<body><main>
<div class="logo">NOVA</div><div class="eyebrow">CENTRAL OPERATIONS INTERFACE</div>
<h1>NOVA Command Center</h1>
<p>Open your existing NOVA Command Center. Sign-in, permissions, data, and operational modules remain managed by the existing Google Apps Script application.</p>
<button class="primary" id="openButton" type="button">OPEN COMMAND CENTER&nbsp; ↗</button>
<button class="secondary" id="installButton" type="button" hidden>INSTALL NOVA</button>
<div class="status" id="status" aria-live="polite">Online access is required to use NOVA modules.</div>
<div class="foot">NOVA SYSTEMS · AUTHORIZED ACCESS</div>
</main>
<script>
"use strict";
const COMMAND_CENTER_URL="https://script.google.com/a/*/macros/s/AKfycbw6nyCmTRuBjjKxI59NOoTY0U3_TY5KpM7ChpwXVBCdlO6XukJ8RpGKDUYz3stBEJfGYQ/exec";
const statusNode=document.getElementById("status"),openButton=document.getElementById("openButton"),installButton=document.getElementById("installButton");
let installPrompt=null;
function isInstalledNOVA(){
return (window.matchMedia&&(
window.matchMedia("(display-mode: standalone)").matches||
window.matchMedia("(display-mode: fullscreen)").matches||
window.matchMedia("(display-mode: minimal-ui)").matches
))||window.navigator.standalone===true;
}
function openCommandCenter(){
if(!/^https:\/\/script\.google\.com\/(?:a\/\*\/)?macros\/s\/.+\/exec(?:\?.*)?$/.test(COMMAND_CENTER_URL)){statusNode.textContent="Setup required: add the current NOVA Command Center /exec URL to index.html before publishing.";return;}
statusNode.textContent="Opening NOVA Command Center…";
window.location.replace(COMMAND_CENTER_URL);
}
if(isInstalledNOVA()){
document.body.classList.add("installed-launch");
statusNode.textContent="Opening NOVA Command Center…";
openButton.hidden=true;
installButton.hidden=true;
window.setTimeout(openCommandCenter,80);
}else{
openButton.addEventListener("click",openCommandCenter);
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;installButton.hidden=false;});
installButton.addEventListener("click",async()=>{
if(!installPrompt){statusNode.textContent="On iPhone/iPad, use Safari Share → Add to Home Screen. On Android, use the browser menu → Install app.";return;}
installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true;
});
}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{if(!isInstalledNOVA())statusNode.textContent="NOVA can still open online; offline shell caching was unavailable.";}));}
</script></body></html>
